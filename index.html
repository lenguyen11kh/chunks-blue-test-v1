    <!-- Patch window.fetch getter-only restriction in iframe environment -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(v) {
              currentFetch = v;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch setter patch error:', e);
        }
      })();
    </script>
